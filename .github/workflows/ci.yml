# Builds the app and runs the unit tests and lint on every push and pull request.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK. With the licences accepted, the Android Gradle
      # plugin downloads the platform the app compiles against by itself.
      - name: Accept the Android SDK licences
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug

      # Reported, not enforced yet: the existing code has never been linted in CI.
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: Lint findings
        if: always()
        run: find app/build -name 'lint-results-debug.txt' -exec cat {} \; || true

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
