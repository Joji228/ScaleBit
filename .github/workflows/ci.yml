# Builds the app and runs the unit tests and lint on every push and pull request.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install the Android platform the app compiles against
        run: sdkmanager --install "platforms;android-37" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug build
        run: ./gradlew --no-daemon assembleDebug

      # Reported, not enforced yet: the existing code has never been linted in CI.
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
