# Publishes a signed release that the in-app updater offers (see docs/updates.md).
# Run it from the Actions tab ("Run workflow") on the branch to release. It reads versionName and
# versionCode from app/build.gradle.kts, so raise versionCode first.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  the keystore that signed the app on your phone, base64-encoded
#   RELEASE_STORE_PASSWORD   its store password
#   RELEASE_KEY_ALIAS        the key alias inside it
#   RELEASE_KEY_PASSWORD     the key password
# Android only updates an app signed with the same key, so it must be that exact keystore.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK. With the licences accepted, the Android Gradle
      # plugin downloads the platform the app compiles against by itself.
      - name: Accept the Android SDK licences
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        id: version
        run: |
          name=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^\s*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          test -n "$name" && test -n "$code"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Refuse a version that's already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.name }}" > /dev/null 2>&1; then
            echo "v${{ steps.version.outputs.name }} already exists: raise versionName and versionCode first." >&2
            exit 1
          fi

      - name: Set up signing
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "The RELEASE_KEYSTORE_BASE64 secret is missing; see the top of this file." >&2
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build the release APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          apk="ScaleBit-$NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha=$(sha256sum "$apk" | cut -d' ' -f1)
          printf '{"versionName": "%s", "versionCode": %s, "apk": "%s", "sha256": "%s"}\n' "$NAME" "$CODE" "$apk" "$sha" > update.json
          gh release create "v$NAME" "$apk" update.json \
            --target "$GITHUB_SHA" \
            --title "ScaleBit $NAME" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}."

      - name: Remove the signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"
